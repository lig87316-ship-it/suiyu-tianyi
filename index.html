#entry input,#entry select,#entry textarea{display:block;width:100%;font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px} #entry{max-height:90vh;overflow:auto}.fieldbtn{overflow-wrap:anywhere}.toast{z-index:10}#entry:has(:invalid) button.primary{opacity:.9}.resource{padding:18px 0;border-top:1px solid var(--line)}.resource p{margin:8px 0}.resource details{border:0}.reviewStats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.reviewStats strong{display:block;font-size:30px}progress{width:100%;height:14px;accent-color:var(--green)}@media(max-width:760px){nav{grid-template-columns:repeat(3,1fr)}.reviewStats{grid-template-columns:1fr 1fr}.head{flex-wrap:wrap}}aside{overflow-y:auto}</style></head><body><aside><div class="brand"><div class="mark" id="logo"></div><div><strong>穗语·田医</strong><small>小麦病害决策助手</small></div></div><div class="navlabel">合作社工作空间</div><nav id="nav"></nav><div class="sidefoot"><span class="dot"></span>豫中示范合作社<small>黄淮麦区 · 本地演示</small></div></aside><main><div class="top"><span class="crumb">合作社工作空间 / <b id="crumb"></b></span><div class="tools"><button id="tour">开始讲解</button><button id="reset">重置演示</button></div></div><div class="wrap"><div id="guide"></div><section id="view"></section><footer><span>穗语·田医　/　知稷应用原型</span><span>模拟数据 · 离线回放</span></footer></div></main><div id="toast" role="status" class="toast"></div><dialog id="confirmReset"><h2>重新开始演示？</h2><p>移除新增地块并清空本次记录，恢复两块示例田。</p><div class="actions"><button id="cancel">取消</button><button class="primary" id="yes">恢复初始场景</button></div></dialog><dialog id="entry"><h2 id="entryHeading"></h2><p id="entryContext"></p><form id="entryForm"><div id="entryInputs" class="stack"></div><div class="actions mt"><button type="button" onclick="this.closest('dialog').close()">取消</button><button class="primary">保存</button></div></form></dialog><script>
'use strict';
const $ = id => document.getElementById(id);
const names=['田间总览','风险研判','用药核验','地块台账','农技资料库','麦季复盘'];
const titles=['麦田工作台','七天病害风险','收获前用药核验','地块作业台账','农技资料库','麦季复盘'];
const pathIcons=['<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>','<path d="M3 19h18M4 15l5-7 4 4 7-9"/>','<path d="M12 3l8 3v6c0 5-5 8-8 10-3-2-8-5-8-10V6z"/><path d="m8.5 12 2.5 2.5 5-5"/>','<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>'];
pathIcons.push('<path d="M3 4q5-2 9 1 4-3 9-1v15q-5-2-9 1-4-3-9-1zM12 5v15"/>','<path d="M3 3v18h18M7 17v-5m5 5V7m5 10V4"/>');
const icon=path=>'<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">'+path+'</svg>';
$('logo').innerHTML=icon('<path d="M7 22 17 3M13 11C8 11 8 6 8 6s6 0 5 5ZM10.5 16C5 16 5 11 5 11s6 0 5.5 5ZM13 13s5 1 7-4c0 0-5-1-7 4ZM10 18s5 1 7-4c0 0-5-1-7 4Z"/>');
const seedFields={A:{name:'东坡麦田',area:68,sow:'10月12日',variety:'演示品种甲'},B:{name:'西渠麦田',area:52,sow:'10月26日',variety:'演示品种乙'}};
const init=()=>({phase:{A:'扬花初期',B:'尚未抽穗'},logs:[],extra:{}});
const key='suiyu-field-demo-v1';
let data=init();try{const cached=JSON.parse(localStorage.getItem(key));if(cached&&Array.isArray(cached.logs)&&['A','B'].every(id=>['扬花初期','尚未抽穗'].includes(cached.phase?.[id])))data=cached;}catch{}
let page=0,field='A',day=2,touring=false,product='demo1',spray='2026-05-25',harvest='2026-06-05',filter='所有地块',timer;
const flor=[38,56,74,78,65,51,42],early=[19,22,26,30,25,23,20],rust=[26,28,32,35,32,30,27];
const scores=id=>data.phase[id]==='扬花初期'?flor:early;
data.extra ||= {}; let fields={...seedFields,...data.extra};
const caption=['先看两块田的生育期。面对同一场雨，已扬花的麦田需要优先核查赤霉病风险。','切换到B田，把物候改为“扬花初期”，观察赤霉病曲线，并展开当天依据。','时间推进到5月。先保存被拦截的核验，再点“试算6月8日收获”，确认模拟作业。','按地块查看计划与实际作业。被拦截的计划保留原因，只有确认执行才计入用药次数。'];
function recordSave(){try{localStorage.setItem(key,JSON.stringify(data));}catch{}}
function notify(t){$('toast').textContent=t;clearTimeout(timer);timer=setTimeout(()=>$('toast').textContent='',2600);}
function go(i){page=i;render();window.scrollTo(0,0);}
function selectField(id){field=id;render();}
function heading(sub,date){return '<div class="titleline"><div><h1>'+titles[page]+'</h1><p>'+sub+'</p></div><div class="date">'+date+'</div></div>';}
function fieldSwitch(){return '<div class="seg">'+fieldIds().map(id=>'<button data-field="'+id+'" class="'+(field===id?'sel':'')+'">'+id+'田 · '+safeText(fields[id].name)+'</button>').join('')+'</div>';}
function chartPanel(full){return '<div class="panel"><div class="head"><div><small>'+field+'田 · '+safeText(fields[field].name)+'</small><h2>两病风险走势</h2></div><small>指数 0–100</small></div><div class="legend"><span><i class="key"></i>赤霉病</span><span><i class="key g"></i>条锈病</span></div><canvas id="chart" class="chart" role="img" aria-label="'+field+'田4月20日至26日赤霉病指数依次为'+scores(field).join('、')+'，条锈病指数依次为'+rust.join('、')+'"></canvas><div class="chartfoot">'+(full?'选择日期可查看当日依据。':'4月23日赤霉病指数预计达到本周峰值 '+Math.max(...scores(field))+'。')+'</div></div>';}
function overview(){const first=fieldIds().filter(id=>data.phase[id]==='扬花初期');const advice=first.length>1?first.length+'块麦田需优先核查':first.length?'雨前先巡'+first[0]+'田':'先核实两块田的物候';
return heading('豫中示范合作社 · '+fieldIds().length+'块麦田 / '+Number(fieldIds().reduce((sum,id)=>sum+fields[id].area,0).toFixed(1))+'亩','回放日期　2026年4月20日')+'<div class="hero"><div class="herotext"><div class="eyeline"><span class="dot"></span>雨前巡田提醒</div><h2>'+advice+'</h2><p>'+(first.length?'预计4月22—23日有雨，降雨窗口与扬花期重合。请核实花期进度，查看赤霉病风险依据。':'当前地块均记录为尚未抽穗。核实抽穗进度后更新物候，系统将重新计算风险。')+'</p><button data-openrisk="'+(first[0]||'A')+'">查看优先地块</button></div><div class="mapbox"><canvas id="map" aria-label="两块示范田位置示意"></canvas><button class="map-tag a" data-openrisk="A">A 东坡麦田</button><button class="map-tag b" data-openrisk="B">B 西渠麦田</button><span class="mapkey">A、B 示范田示意图</span></div></div><div class="grid">'+chartPanel(false)+'<div class="panel"><div class="head"><h2>我的地块</h2><button data-newfield class="mini">新增地块</button></div><div class="fieldlist">'+fieldIds().map(id=>'<button class="fieldbtn '+(field===id?'sel':'')+'" data-field="'+id+'"><span class="row"><b>'+id+'田 · '+safeText(fields[id].name)+'</b><span class="status '+(first.includes(id)?'':'good')+'">'+(first.includes(id)?'优先巡查':'跟踪物候')+'</span></span><span class="subtle">'+fields[id].area+'亩　·　'+data.phase[id]+'</span></button>').join('')+'</div><button class="plain" data-go="1">查看'+field+'田的分日依据</button></div></div>';}
function riskComparison(){
  const delta=flor[day]-early[day];
  return '<section class="panel stack mt"><div class="head"><div><small class="subtle">同日对照 · 演示样本 R1</small><h2>只改变物候，会怎样？</h2></div></div><p>固定4月'+(20+day)+'日的预报与区域通报，比较两种物候对应的巡查优先指数。</p><div class="facts"><div class="fact"><small>尚未抽穗 · 赤霉病</small><strong>'+early[day]+'</strong></div><div class="fact"><small>扬花初期 · 赤霉病</small><strong>'+flor[day]+'</strong></div></div><p>两种场景相差 '+delta+' 分；条锈病均为 '+rust[day]+' 分。数值来自两组预置序列，仅供演示排序。公开农技资料解释关注花期的原因，具体分值尚待田间校准。</p></section>';
}
function risk(){const d=20+day;const flower=data.phase[field]==='扬花初期';return heading('对照田间物候与天气，决定何时巡田。','预报版本　04月20日 08:00')+fieldSwitch()+'<div class="grid">'+chartPanel(true)+'<section class="panel stack"><div><small class="subtle">当季地块档案</small><h2>'+safeText(fields[field].name)+'</h2></div><div class="facts"><div class="fact"><small>播期</small><b>'+safeText(fields[field].sow)+'</b></div><div class="fact"><small>品种</small><b>'+safeText(fields[field].variety)+'</b></div></div><label>田间确认的物候<select class="control" id="phase">'+['尚未抽穗','扬花初期'].map(s=>'<option '+(data.phase[field]===s?'selected':'')+'>'+s+'</option>').join('')+'</select></label></section></div><div class="panel stack mt"><div class="head"><h2>4月'+d+'日 · 风险依据</h2><span class="status">'+(flower?'关注扬花窗口':'跟踪抽穗进度')+'</span></div><div class="seg">'+flor.map((_,i)=>'<button data-day="'+i+'" class="'+(day===i?'sel':'')+'">4/'+(20+i)+'</button>').join('')+'</div><p>赤霉病 <b>'+scores(field)[day]+'</b> 分，条锈病 <b>'+rust[day]+'</b> 分。'+(day===2||day===3?'模拟预报显示当日有雨。':'模拟预报显示当日无持续降雨。')+(flower?'该田已确认扬花，巡田时重点核实花期及穗部状况。':'该田尚未抽穗，先核实物候，继续观察周边病情。')+'</p><details><summary>展开规则与资料出处</summary><p>演示规则按物候与雨期选取预置指数序列，用于展示巡查顺序。条锈病另参照当地病情通报与巡田结果；本例两田使用相同的通报样本。</p><p>农艺背景　河南省农业科学院《2025年全省小麦苗情分析和春季管理技术对策》。<a target="_blank" rel="noopener" href="https://www.hnagri.org.cn/article-109381.html">阅读来源</a></p></details><div class="actions"><button data-patrol>记录本日巡查</button><button class="primary" data-go="2">进入收获前用药核验</button></div></div>';}
const dayms=86400000;
const sampleLabels={
  demo1:{code:'DEMO-01',name:'样品甲',days:14,group:'演示组甲'},
  demo2:{code:'DEMO-02',name:'样品乙',days:21,group:'演示组乙'}
};
function verdict(){
  const label=sampleLabels[product];
  if(!label||!spray||!harvest)return {kind:'wait',title:'待复核',reason:'请补全产品标识、拟作业日和最早收获日。'};
  const start=Date.parse(spray+'T00:00:00Z'), end=Date.parse(harvest+'T00:00:00Z');
  if(!Number.isFinite(start+end))return {kind:'wait',title:'待复核',reason:'请核实日期格式。'};
  const diff=Math.round((end-start)/dayms);
  const min=new Date(start+label.days*dayms).toISOString().slice(0,10);
  const reason=diff<0?'预计收获早于拟作业日，请核实日期。':'距最早收获 '+diff+' 天，'+(diff<label.days?'还差 '+(label.days-diff)+' 天。':'已满足'+label.days+'天间隔。');
  return {kind:diff<label.days?'block':'pass',title:diff<label.days?'不能打':'按当前条件可打',reason,min};
}
function priorGroup(){
  const label=sampleLabels[product];
  if(!label)return;
  return data.logs.filter(r=>r.field===field&&r.type==='实际作业'&&r.when<spray&&r.group===label.group)
